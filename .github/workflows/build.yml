
name: ProjectX MEGA - Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find . -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            | head -n 1 || true)

          if [[ -z "$SETTINGS" ]]; then
            ZIP=$(find . -maxdepth 3 \
              -type f -name '*.zip' \
              | head -n 1 || true)

            if [[ -z "$ZIP" ]]; then
              echo "ERROR: Android project or ZIP not found"
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP" -d extracted

            SETTINGS=$(find extracted -type f \
              \( -name settings.gradle.kts \
              -o -name settings.gradle \) \
              | head -n 1 || true)
          fi

          if [[ -z "$SETTINGS" ]]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [[ ! -f app/build.gradle.kts \
            && ! -f app/build.gradle ]]; then
            echo "ERROR: app Gradle file missing"
            exit 1
          fi

          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectX-MEGA-debug
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
